spring.application.name=kafka-admin-service

# Puerto propio del Kafka Admin Service
server.port=8083

# Conexion con Kafka (listener externo del docker-compose)
pedidos360.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
pedidos360.kafka.request-timeout-ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
